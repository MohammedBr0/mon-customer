    admin:
      intro: Money people hold in the service. Top-ups arrive through Afro Pay; withdrawals are sent by you and marked here.
      customer_money: Held for customers
      available: Available to spend or withdraw
      held: Set aside for rides and withdrawals
      platform_fees: Platform fees earned
      pending_withdrawals: Withdrawals to send
      no_withdrawals: No withdrawals are waiting.
      settle: Release payments that are due
      settled:
        one: 1 payment released to its driver.
        other: "%{count} payments released to their drivers."
