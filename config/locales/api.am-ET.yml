am-ET:
  api:
    not_found: አልተገኘም
    unauthorized: እባክዎ እንደገና ይግቡ
    banned: ይህ መለያ ታግዷል
    rate_limited: ብዙ ሙከራዎች። ከጥቂት ደቂቃዎች በኋላ እንደገና ይሞክሩ።
    invalid_login: ስልክ ቁጥርዎን ወይም ኢሜይልዎን ያስገቡ
    invalid_phone: "የኢትዮጵያ ሞባይል ቁጥር ያስገቡ፣ ለምሳሌ 0911 22 33 44"
    phone_taken: ይህ ስልክ ቁጥር መለያ አለው። ይግቡ።
    sms_unavailable: የጽሑፍ መልእክቱን መላክ አልቻልንም። ከጥቂት ጊዜ በኋላ እንደገና ይሞክሩ።
    invalid_code: ኮዱ የተሳሳተ ነው ወይም ጊዜው አልፏል። አዲስ ይጠይቁ።
    otp_sms: "የ%{app} ኮድዎ"
    trip_cancelled: ይህ ጉዞ ተሰርዟል
    trip_not_live: መጀመሪያ ጉዞውን ይጀምሩ
    maps_unavailable: ካርታዎች አሁን አይገኙም
    no_route: በእነዚህ ቦታዎች መካከል የመኪና መንገድ አልተገኘም
  notifications:
    booking_requested:
      title: አዲስ የመቀመጫ ጥያቄ
      body: "%{person} በ%{trip} ላይ %{seats} መቀመጫ ጠይቀዋል"
    booking_confirmed:
      title: ቦታ ማስያዣ ተረጋግጧል
      body: "%{person} በ%{trip} ላይ መቀመጫዎን አረጋግጠዋል"
    booking_declined:
      title: ቦታ ማስያዣ አልተቀበለም
      body: "%{person} በ%{trip} ላይ ሊያሳፍርዎት አልቻሉም"
    booking_cancelled:
      title: ቦታ ማስያዣ ተሰርዟል
      body: "%{person} በ%{trip} ላይ ያለውን ቦታ ማስያዣ ሰርዘዋል"
    date_skipped:
      title: አንድ ቀን ተዘሏል
      body: "%{person} በ%{trip} ላይ %{date} ዘለዋል"
    itinerary_cancelled:
      title: ጉዞ ተሰርዟል
      body: "%{person} %{trip} ሰርዘዋል"
    new_message:
      title: አዲስ መልእክት
      body: "%{person}: %{preview}"
    review_received:
      title: አዲስ አስተያየት
      body: "%{person} %{rating}/5 ሰጥተዎታል"
    trip_started:
      title: ጉዞዎ ተጀምሯል
      body: "%{person} ለ%{trip} በመንገድ ላይ ናቸው። መኪናውን ለመከታተል ጉዞውን ይክፈቱ።"
    alert_match:
      title: አንድ ጉዞ ከማንቂያዎ ጋር ይስማማል
      body: "%{route}: %{trip}"
