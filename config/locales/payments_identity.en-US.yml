    errors:
      models:
        identity_document:
          attributes:
            content_type:
              not_an_image: must be a JPEG, PNG or WebP photo
            image:
              too_large: is too large (5 MB at most)
            number:
              invalid_fan: must be the 16-digit FAN from your Fayda card
        avatar:
          attributes:
            content_type:
              not_an_image: must be a JPEG, PNG or WebP photo
            image:
              too_large: is too large (2 MB at most)
