    person: Person
    number: Document number (FAN for a national ID)
    status: Status
    sent: Sent
    approve: Approve
    reject: Reject
    reason: Why it is rejected (the person sees this)
    reason_hint: For example, the photo is blurred
    kinds:
      driver_license: Driving licence
      national_id: National ID
    statuses:
      pending: Waiting
      approved: Approved
      rejected: Rejected
      missing: Not sent
    flash:
      approved: Document approved.
      rejected: Document rejected.
