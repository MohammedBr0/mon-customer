am-ET:
  wallet:
    topup_description: "የ%{app} ቦርሳ መሙያ"
    sms:
      topup: "%{amount} ብር ወደ %{app} ቦርሳዎ ተጨምሯል። ማጣቀሻ %{reference}። ደረሰኝ፦ %{receipt}"
      withdrawal: "%{amount} ብር ከ%{app} ቦርሳዎ ወደ %{account} ተልኳል። ማጣቀሻ %{reference}"
    done_title: ክፍያው ደርሷል
    done_body: "አሁን ወደ %{app} መተግበሪያ መመለስ ይችላሉ። ቦርሳዎ በቅጽበት ይዘምናል።"
    transfer_failed: Chapa ዝውውሩን ማጠናቀቅ አልቻለም።
    errors:
      disabled: የቦርሳ ክፍያ አሁን አይገኝም
      insufficient: በቦርሳው ውስጥ በቂ ገንዘብ የለም
      gateway: "ክፍያውን መጀመር አልተቻለም (%{reason})። እንደገና ይሞክሩ።"
  notifications:
    wallet_topup:
      title: ገንዘብ ተጨምሯል
      body: "%{amount} ብር ወደ ቦርሳዎ ተጨምሯል"
    payment_received:
      title: ክፍያ ደርሶዎታል
      body: "%{amount} ብር ከ%{person} ለ%{trip}"
    payment_refunded:
      title: ገንዘብ ተመልሷል
      body: "ለ%{trip} %{amount} ብር ወደ ቦርሳዎ ተመልሷል"
    withdrawal_paid:
      title: ገንዘብ ተልኳል
      body: "%{amount} ብር ወደ ሂሳብዎ ተልኳል"
    withdrawal_rejected:
      title: ገንዘብ አልተላከም
      body: "%{amount} ብር ወደ ቦርሳዎ ተመልሷል፦ %{reason}"
